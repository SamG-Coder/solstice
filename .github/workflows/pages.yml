name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Scenes are baked on a PC and published as releases (scripts/publish-scenes.py), since
      # baking them here takes long. Each comes from the release scenes/releases.txt names for
      # it, and must match the checksum recorded there.
      - name: Download the baked scenes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          grep -v '^#' scenes/releases.txt | while read -r name tag digest; do
            [ -n "$name" ] || continue
            gh release download "$tag" --pattern "$name" --dir assets
            echo "$digest  assets/$name" | sha256sum --check
          done
          ls -l assets
      - name: Build the site
        run: bash scripts/build-web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Hundreds of megabytes of scenes take longer to sync than the default ten minutes.
          timeout: 1800000
