name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
            - name: Bake the temple
        run: cargo run --release -p bake -- --quality web --output assets/web.solstice
      - name: Fetch the cove's scans
        run: python3 scripts/fetch-scans.py scenes/cove.txt 2k
      - name: Bake the cove
        run: cargo run --release -p bake -- --scene scenes/cove.txt --texture-size 1024 --output assets/cove.solstice

      - name: Build the site
        run: bash scripts/build-web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
