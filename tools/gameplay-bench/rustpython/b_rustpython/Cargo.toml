[package]
name = "b_rustpython"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
rustpython-vm = { version = "0.6", default-features = false, features = ["compiler"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustpython-vm = { version = "0.6", default-features = false, features = ["compiler", "host_env"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
rustpython-vm = { version = "0.6", default-features = false, features = ["compiler", "wasmbind"] }
wasm-bindgen = "=0.2.130"
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
