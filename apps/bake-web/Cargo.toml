[package]
name = "bake-web"
description = "The bake, built for the browser: the editor's Web Worker bakes a project's scene with it (docs/editor.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "solstice_bake_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
solstice-asset.workspace = true
solstice-bake.workspace = true
solstice-project.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
